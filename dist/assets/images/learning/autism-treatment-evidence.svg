<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fbf4ed"/><path d="M0 0H1200V16H0Z" fill="#78314b"/><circle cx="1140" cy="95" r="190" fill="#edddd6"/><g font-family="Arial,sans-serif"><text x="58" y="78" font-size="20" letter-spacing="3" fill="#78314b">AASHA / UNDERSTANDING EVIDENCE</text><text x="58" y="157" font-size="47" font-weight="700" fill="#243e38">Turn a promise into a question</text><rect x="58" y="223" width="350" height="245" rx="20" fill="#fffdf9" stroke="#a5b8ad"/><circle cx="104" cy="278" r="25" fill="#78314b"/><text x="104" y="286" text-anchor="middle" fill="white" font-size="23">1</text><text x="83" y="357" font-size="29" font-weight="700" fill="#243e38">What changed?</text><text x="83" y="407" font-size="20" fill="#3f554e">A meaningful outcome</text><rect x="425" y="223" width="350" height="245" rx="20" fill="#fffdf9" stroke="#a5b8ad"/><circle cx="471" cy="278" r="25" fill="#78314b"/><text x="471" y="286" text-anchor="middle" fill="white" font-size="23">2</text><text x="450" y="357" font-size="29" font-weight="700" fill="#243e38">Compared with?</text><text x="450" y="407" font-size="20" fill="#3f554e">A fair comparison</text><rect x="792" y="223" width="350" height="245" rx="20" fill="#fffdf9" stroke="#a5b8ad"/><circle cx="838" cy="278" r="25" fill="#78314b"/><text x="838" y="286" text-anchor="middle" fill="white" font-size="23">3</text><text x="817" y="357" font-size="29" font-weight="700" fill="#243e38">At what cost?</text><text x="817" y="407" font-size="20" fill="#3f554e">Harms, time and burden</text><text x="58" y="535" font-size="23" fill="#243e38">A mechanism suggests a hypothesis. Clinical evidence tests a benefit.</text><text x="58" y="588" font-size="17" letter-spacing="2" fill="#78314b">LEARN / ASK / PLAN TOGETHER</text></g></svg>