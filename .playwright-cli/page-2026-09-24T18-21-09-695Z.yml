        - generic [ref=f1e35]:
          - strong [ref=f1e36]: "Direct answer:"
          - text: Mind Grace Neuropsychiatric Clinic in Greater Noida provides adult psychiatric consultations, child development and ADHD or autism guidance, counselling for individuals, couples, and families, and structured assessments. You do not need a diagnosis to begin — the first visit clarifies the concern and the next step.
        - paragraph [ref=f1e37]: Most people start because something feels harder than it should, not because they already have a diagnosis. These service areas are here to make the next step clearer in Greater Noida.
