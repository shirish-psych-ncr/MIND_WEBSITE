    - region [ref=f1e82]:
      - generic [ref=f1e83]:
        - text: Mind Grace Neuropsychiatric Clinic
        - heading "Adult Psychiatry Services" [level=2] [ref=f1e84]
        - paragraph [ref=f1e85]: Consultations for anxiety, depression, ADHD, sleep concerns, mood changes, and related mental health needs.
      - generic [ref=f1e86]:
        - article [ref=f1e87]:
          - heading "Psychiatric Consultation" [level=3] [ref=f1e89]
          - paragraph [ref=f1e90]: You might start here if you are not fully sure what is going on but want a structured first conversation. Often useful for anxiety, mood changes, sleep concerns, attention problems, or overlapping symptoms.
          - generic [ref=f1e91]:
            - link "Book Consultation" [ref=f1e92] [cursor=pointer]:
              - /url: /book.html
            - link "See what to expect" [ref=f1e93] [cursor=pointer]:
              - /url: /process.html
        - article [ref=f1e94]:
          - heading "Medication Review" [level=3] [ref=f1e96]
          - paragraph [ref=f1e97]: Useful if you are already on medication, adjusting to treatment, or trying to understand whether the current plan still fits. Follow-up visits focus on response, side effects, daily functioning, and practical next steps.
          - link "Book Follow-up" [ref=f1e99] [cursor=pointer]:
            - /url: /book.html
        - article [ref=f1e100]:
          - heading "Anxiety and Panic Care" [level=3] [ref=f1e102]
          - paragraph [ref=f1e103]: You might relate to this if there is constant worry, panic, overthinking, physical tension, or avoidance. Support may include explanation, coping strategy planning, therapy guidance, and medication when appropriate.
          - generic [ref=f1e104]:
            - link "Get Help" [ref=f1e105] [cursor=pointer]:
              - /url: /book.html
            - link "See Symptoms" [ref=f1e106] [cursor=pointer]:
              - /url: /conditions.html#anxiety
        - article [ref=f1e107]:
          - heading "Mood Support" [level=3] [ref=f1e109]
          - paragraph [ref=f1e110]: You might start here if there is loss of interest, heaviness, irritability, exhaustion, or difficulty functioning. The first step is understanding the pattern and daily impact before deciding what kind of treatment fits best.
          - generic [ref=f1e111]:
            - link "Get Help" [ref=f1e112] [cursor=pointer]:
              - /url: /book.html
            - link "See Symptoms" [ref=f1e113] [cursor=pointer]:
              - /url: /conditions.html#depression
            - link "Bipolar Resources" [ref=f1e114] [cursor=pointer]:
              - /url: /bipolar-mood-disorders.html
        - article [ref=f1e115]:
          - heading "Psychosis & Schizophrenia Care" [level=3] [ref=f1e117]
          - paragraph [ref=f1e118]: Specialized support for unusual perceptions, belief changes, or thought difficulties. Early intervention and consistent care can significantly improve outcomes.
          - generic [ref=f1e119]:
            - link "Book Consultation" [ref=f1e120] [cursor=pointer]:
              - /url: /book.html
            - link "Learn More" [ref=f1e121] [cursor=pointer]:
              - /url: /psychosis-schizophrenia.html
        - article [ref=f1e122]:
          - heading "Trauma & Grief Support" [level=3] [ref=f1e124]
          - paragraph [ref=f1e125]: Compassionate care for traumatic experiences, loss, and bereavement. Evidence-based therapies help process difficult memories and rebuild safety.
          - generic [ref=f1e126]:
            - link "Get Support" [ref=f1e127] [cursor=pointer]:
              - /url: /book.html
            - link "Resources" [ref=f1e128] [cursor=pointer]:
              - /url: /trauma-grief-support.html
        - article [ref=f1e129]:
          - heading "Addiction & Substance Use" [level=3] [ref=f1e131]
          - paragraph [ref=f1e132]: Non-judgmental support for alcohol, drug, or behavioral addictions. Treatment includes assessment, harm reduction, and recovery planning.
          - generic [ref=f1e133]:
            - link "Confidential Help" [ref=f1e134] [cursor=pointer]:
              - /url: /book.html
            - link "Learn More" [ref=f1e135] [cursor=pointer]:
              - /url: /addiction-substance-use.html
        - article [ref=f1e136]:
          - heading "Sleep & Eating Disorders" [level=3] [ref=f1e138]
          - paragraph [ref=f1e139]: Support for insomnia, irregular sleep patterns, and eating concerns. Integrated approaches address both physical and psychological factors.
          - generic [ref=f1e140]:
            - link "Book Assessment" [ref=f1e141] [cursor=pointer]:
              - /url: /book.html
            - link "View Guide" [ref=f1e142] [cursor=pointer]:
              - /url: /sleep-eating-disorders.html
        - article [ref=f1e143]:
          - heading "Adult ADHD Assessment" [level=3] [ref=f1e145]
          - paragraph [ref=f1e146]: You might relate to this if concentration, organisation, task-starting, forgetfulness, or overwhelm have been long-standing problems. Assessment can include pattern review, practical support, and discussion of treatment options.
          - generic [ref=f1e147]:
            - link "Book Assessment" [ref=f1e148] [cursor=pointer]:
              - /url: /book.html
            - link "Read Articles" [ref=f1e149] [cursor=pointer]:
              - /url: /blog/index.html
    - region [ref=f1e150]:
      - generic [ref=f1e151]:
        - text: Aasha Early Intervention
        - heading "Child Development & Parent Support" [level=2] [ref=f1e152]
        - paragraph [ref=f1e153]: Child-development assessment, parent guidance, and referrals or support for communication, learning, and daily participation concerns.
      - generic [ref=f1e154]:
        - article [ref=f1e155]:
          - heading "Speech and Language Support" [level=3] [ref=f1e157]
          - paragraph [ref=f1e158]: Useful when talking seems delayed, unclear, inconsistent, or harder than expected for age. Early support is often most helpful when communication is affecting learning, interaction, or confidence.
          - link "Book Child Consultation" [ref=f1e160] [cursor=pointer]:
            - /url: /book.html
        - article [ref=f1e161]:
          - heading "Occupational Therapy" [level=3] [ref=f1e163]
          - paragraph [ref=f1e164]: Useful for sensory regulation, coordination, attention, self-help tasks, and daily participation concerns. Parents often notice these concerns in routines, play, school transitions, or behaviour.
          - link "Book Child Consultation" [ref=f1e166] [cursor=pointer]:
            - /url: /book.html
        - article [ref=f1e167]:
          - heading "Parent Guidance" [level=3] [ref=f1e169]
          - paragraph [ref=f1e170]: Useful when families need practical ways to understand behaviour, routines, school demands, or communication patterns. This often works best when parents, caregivers, and therapists are aligned around one clear plan.
          - generic [ref=f1e171]:
            - link "Book Parent Session" [ref=f1e172] [cursor=pointer]:
              - /url: /book.html
            - link "Read Articles" [ref=f1e173] [cursor=pointer]:
              - /url: /blog/index.html
