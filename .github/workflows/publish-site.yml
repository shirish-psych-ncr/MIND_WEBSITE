name: Build journal and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install site dependencies
        run: npm ci
      - name: Build Astro site into dist/
        run: npx astro build
      - name: Test article discovery
        run: python -m unittest discover -s tests -v
      - name: Generate article cards and structured data
        run: python scripts/build_blog_index.py
      - name: Stage public site
        run: cp -r dist _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines via IndexNow
        # Instantly tells Bing/Yandex/Seznam/Naver (and AI tools that read
        # Bing's index) about changed, new, removed, or redirected pages.
        # Requires the INDEXNOW_KEY secret; the key file must be reachable at
        # https://mindgracencr.in/<key>.txt once the deploy above is live.
        if: ${{ success() && env.INDEXNOW_KEY != '' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/indexnow_submit.py --submit
