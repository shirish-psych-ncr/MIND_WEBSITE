name: Build journal and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test article discovery
        run: python -m unittest discover -s tests -v
      - name: Generate article cards and structured data
        run: python scripts/build_blog_index.py
      - name: Stage public site
        run: |
          python - <<'PY'
          import shutil
          shutil.copytree('.', '_site', ignore=shutil.ignore_patterns('.git', '.github', '_site', 'scripts', 'tests', '__pycache__', '*.pyc', 'node_modules', '.env*'))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
