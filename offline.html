<!-- Amplitude Analytics - Browser SDK v2 -->
<script type="module">
  // Amplitude ingestion key — public by design; move to an env var when you set up environments.
  const AMPLITUDE_API_KEY = 'bcd984f11210e7e9d3f74d505271cf04';

  if (!AMPLITUDE_API_KEY) {
    console.warn('Amplitude API key missing — analytics disabled');
  } else {
    import('https://cdn.amplitude.com/libs/analytics-browser@2/analytics-browser-min.js').then(({ init, track }) => {
      // Initialize Amplitude ONCE with Browser SDK v2
      init(AMPLITUDE_API_KEY, {
        autocapture: {
          pageViews: true,
          elementInteractions: true,
          formInteractions: true,
          fileDownloads: true
        },
        defaultTracking: {
          sessions: true,
          pageViews: true,
          formInteractions: true,
          elementInteractions: true,
          fileDownloads: true
        },
        ingestionMetadata: {
          sourceName: 'mindgracencr.in',
          sourceVersion: '2.0.0'
        }
      });

      console.log('✅ Amplitude Analytics v2 initialized');

      // Track initial page view
      track('Page Viewed', {
        page_path: window.location.pathname,
        page_title: document.title
      });

      // Auto-track phone clicks
      document.querySelectorAll('a[href^="tel:"]').forEach(link => {
        link.addEventListener('click', () => {
          track('Phone Clicked', {
            page_path: window.location.pathname
          });
        });
      });

      // Auto-track WhatsApp clicks
      document.querySelectorAll('a[href*="wa.me"], a[href*="whatsapp.com"]').forEach(link => {
        link.addEventListener('click', () => {
          track('WhatsApp Clicked', {
            page_path: window.location.pathname
          });
        });
      });

      // Auto-track CTA buttons with data attribute
      document.querySelectorAll('[data-amp-track-cta]').forEach(button => {
        button.addEventListener('click', () => {
          track('CTA Clicked', {
            cta_name: button.dataset.ampTrackCta,
            page_path: window.location.pathname
          });
        });
      });

      // Auto-track form interactions
      const trackedForms = new Set();
      document.querySelectorAll('#bookingForm, #contactForm, form[data-track="true"]').forEach(form => {
        const formName = form.id || form.dataset.formName || 'unknown_form';
        
        form.querySelectorAll('input, textarea, select').forEach(field => {
          field.addEventListener('focus', () => {
            if (!trackedForms.has(formName)) {
              trackedForms.add(formName);
              track('Contact Form Started', {
                form_name: formName,
                page_path: window.location.pathname
              });
            }
          }, { once: true });
        });

        form.addEventListener('submit', () => {
          const serviceName = form.dataset.serviceName || 
                             form.querySelector('[name="service"]')?.value || 
                             'General Inquiry';
          setTimeout(() => {
            track('Contact Form Submitted', {
              form_name: formName,
              service_name: serviceName,
              page_path: window.location.pathname
            });
          }, 100);
        });
      });

      // Track service page views automatically
      const h1 = document.querySelector('h1');
      if (h1 && !window.location.pathname.includes('/blog/')) {
        track('Service Viewed', {
          service_name: h1.textContent.trim(),
          page_path: window.location.pathname
        });
      }

    }).catch(err => {
      console.warn('Amplitude SDK failed to load:', err);
    });
  }
</script>
